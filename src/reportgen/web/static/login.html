<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>Вход — 2 специальный отдел</title>
    <link rel="icon" type="image/png" href="/static/emblem.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="login-page">
    <!-- Фон: фотография ночной Земли с орбиты, переданная отделом. Лежит
         рядом файлом static/login-bg.jpg — изолированная машина ничего не
         скачивает.

         Своя фотография всегда важнее: положите файл login-bg.jpg рядом
         с settings.json, и окно входа возьмёт его. -->
    <img class="sky-photo" src="/brand/login-image" alt="">

    <div class="login-shell">
    <div class="login-card">
        <div class="brand">
            <!-- Эмблема отдела: тот же файл, что и в шапке приложения. Здесь
                 он крупнее — это единственное место, где у системы есть лицо. -->
            <span class="emblem emblem--card" aria-label="Эмблема 2 специального отдела">
                <img class="emblem-img" src="/static/emblem.png" alt="" width="256" height="256" draggable="false">
            </span>
            <span>2 специальный отдел</span>
            <small>Подготовка, учёт и проверка технических отчётов</small>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="login-error" id="error" hidden></div>
            <label class="field">Логин
                <input type="text" id="login" name="login" autocomplete="username" autocapitalize="off"
                    spellcheck="false" required autofocus>
            </label>
            <label class="field">Пароль
                <div class="pw-field">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        required>
                    <button class="btn btn--ghost btn--sm pw-toggle" type="button" id="pw-toggle"
                        title="Показать пароль">Показать</button>
                </div>
            </label>
            <button class="btn btn--primary" type="submit" id="submit">Войти</button>
        </form>

        <!-- Заявка на доступ. Заводить каждого руками в отделе некому, поэтому
             человек подаёт заявку сам, а доступ ей открывает создатель системы,
             начальник отдела, его заместитель или начальник группы. Должность
             в заявке не спрашиваем: её назначает тот, кто одобряет. -->
        <form id="signup-form" autocomplete="off" hidden>
            <div class="login-error" id="signup-error" hidden></div>
            <div class="login-note" id="signup-done" hidden>
                Заявка отправлена. Доступ откроет начальник отдела, его
                заместитель или начальник группы — после этого входите под
                своим логином.
            </div>
            <label class="field">Фамилия, имя, отчество
                <input type="text" id="signup-name" name="full_name"
                    placeholder="Жуков Пётр Иванович" autocomplete="off" required>
            </label>
            <label class="field">Логин
                <input type="text" id="signup-login" name="new_login" autocapitalize="off"
                    spellcheck="false" autocomplete="off" required>
            </label>
            <label class="field">Пароль (не короче 8 знаков)
                <input type="password" id="signup-password" name="new_password"
                    autocomplete="new-password" minlength="8" required>
            </label>
            <button class="btn btn--primary" type="submit" id="signup-submit">Отправить заявку</button>
        </form>

        <button class="btn btn--ghost btn--sm login-alt" type="button" id="mode-toggle">
            Нет доступа? Подать заявку
        </button>
    </div>
    </div>

    <script>
        'use strict';

        // Страница входа намеренно самостоятельна: она не зависит от app.js,
        // чтобы её можно было открыть даже при ошибке в основном приложении.
        (function () {
            const form = document.getElementById('login-form');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submit = document.getElementById('submit');
            const errorBox = document.getElementById('error');
            const toggle = document.getElementById('pw-toggle');

            // Пароль на изолированной машине набирают руками, без менеджера
            // паролей: вслепую длинный пароль вводят с опечаткой и получают
            // «неверный логин или пароль», не понимая, где ошиблись.
            toggle.addEventListener('click', function () {
                const shown = passwordInput.type === 'text';
                passwordInput.type = shown ? 'password' : 'text';
                toggle.textContent = shown ? 'Показать' : 'Скрыть';
                toggle.title = shown ? 'Показать пароль' : 'Скрыть пароль';
                passwordInput.focus();
            });

            function nextUrl() {
                const raw = new URLSearchParams(location.search).get('next') || '';
                // Пускаем только внутренние адреса: никаких переходов на чужие хосты.
                if (raw.startsWith('#/')) return '/' + raw;
                if (raw.startsWith('/') && !raw.startsWith('//')) return raw;
                return '/';
            }

            function showError(text) {
                errorBox.textContent = text;
                errorBox.hidden = false;
            }

            function hideError() {
                errorBox.hidden = true;
            }

            async function alreadyIn() {
                try {
                    const response = await fetch('/api/me', { credentials: 'same-origin' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && (data.user || data.auth_enabled === false)) {
                        location.replace(nextUrl());
                    }
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();
                const login = loginInput.value.trim();
                const password = passwordInput.value;
                if (!login || !password) {
                    showError('укажите логин и пароль');
                    return;
                }
                submit.disabled = true;
                submit.textContent = 'Проверка…';
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: login, password: password }),
                    });
                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = null;
                    }
                    if (!response.ok) {
                        showError((data && data.error) || ('не удалось войти (код ' + response.status + ')'));
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }
                    location.replace(nextUrl());
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Войти';
                }
            });

            // Переключение «вход ↔ заявка». Две формы на одной карточке: на
            // изолированной машине лишних страниц лучше не заводить.
            const signupForm = document.getElementById('signup-form');
            const signupError = document.getElementById('signup-error');
            const signupDone = document.getElementById('signup-done');
            const signupName = document.getElementById('signup-name');
            const signupLogin = document.getElementById('signup-login');
            const signupPassword = document.getElementById('signup-password');
            const signupSubmit = document.getElementById('signup-submit');
            const modeToggle = document.getElementById('mode-toggle');

            function showMode(signup) {
                form.hidden = signup;
                signupForm.hidden = !signup;
                modeToggle.textContent = signup
                    ? 'Уже есть доступ? Войти'
                    : 'Нет доступа? Подать заявку';
                hideError();
                signupError.hidden = true;
                (signup ? signupName : loginInput).focus();
            }

            modeToggle.addEventListener('click', function () {
                showMode(signupForm.hidden);
            });

            signupForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                signupError.hidden = true;
                signupDone.hidden = true;
                const fullName = signupName.value.trim();
                const login = signupLogin.value.trim();
                const password = signupPassword.value;
                if (!fullName || !login || !password) {
                    signupError.textContent = 'заполните все поля';
                    signupError.hidden = false;
                    return;
                }
                // Одной фамилии мало: имя есть у всех, а восстановить его из
                // «Жуков» потом не сможет никто.
                if (fullName.split(/\s+/).length < 2) {
                    signupError.textContent = 'напишите фамилию, имя и отчество полностью';
                    signupError.hidden = false;
                    return;
                }
                if (password.length < 8) {
                    signupError.textContent = 'пароль короче 8 знаков';
                    signupError.hidden = false;
                    return;
                }
                signupSubmit.disabled = true;
                signupSubmit.textContent = 'Отправка…';
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            login: login,
                            password: password,
                            full_name: fullName,
                        }),
                    });
                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = null;
                    }
                    if (!response.ok) {
                        signupError.textContent = (data && data.error)
                            || ('не удалось подать заявку (код ' + response.status + ')');
                        signupError.hidden = false;
                        return;
                    }
                    signupName.value = '';
                    signupLogin.value = '';
                    signupPassword.value = '';
                    signupDone.hidden = false;
                } catch (error) {
                    signupError.textContent = 'сервер недоступен: проверьте, запущен ли reportgen';
                    signupError.hidden = false;
                } finally {
                    signupSubmit.disabled = false;
                    signupSubmit.textContent = 'Отправить заявку';
                }
            });

            alreadyIn();
        })();
    </script>
</body>

</html>
