<body class="login-page">
    <!-- Фон: фотография ночной Земли с орбиты, переданная отделом. Лежит
         рядом файлом static/login-bg.jpg — изолированная машина ничего не
         скачивает.

         Своя фотография всегда важнее: положите файл login-bg.jpg рядом
         с settings.json, и окно входа возьмёт его. -->
    <img class="sky-photo" src="/brand/login-image" alt="">

    <div class="login-shell">
    <div class="login-card">
        <div class="brand">
            <!-- Эмблема отдела: та же, что в шапке приложения. Здесь она
                 крупнее — это единственное место, где у системы есть лицо.
                 Вращение делает один CSS, скрипт для него не нужен. -->
            <span class="emblem emblem--card" aria-label="Эмблема 2 специального отдела">
                <svg class="emblem-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                    <!-- Щит: золотая полоса между чёрной кромкой снаружи и чёрным полем
                         внутри — как на образце. Обе линии рисует один и тот же контур
                         разной толщины, второго пути под кайму не нужно. -->
                    <path class="em-frame-out" d="M17 8H83A3 3 0 0 1 86 11V45C86 69 70 86 50 95 30 86 14 69 14 45V11A3 3 0 0 1 17 8Z" />
                    <path class="em-frame" d="M17 8H83A3 3 0 0 1 86 11V45C86 69 70 86 50 95 30 86 14 69 14 45V11A3 3 0 0 1 17 8Z" />
                    <path class="em-frame-in em-fine" d="M20 13H80V45C80 66 66 80 50 88 34 80 20 66 20 45Z" />
                    <!-- Звезда: шестнадцать зубцов, длинные через один. Серебряная кайма
                         лежит ПОД красным и выходит наружу — так зубцы читаются красными,
                         а не белыми, как вышло бы при обводке поверх заливки. -->
                    <path class="em-star-halo em-fine" d="M50.00 13.00 54.58 22.95 62.63 15.51 63.06 26.46 73.33 22.67 69.54 32.94 80.49 33.37 73.05 41.42 83.00 46.00 73.05 50.58 80.49 58.63 69.54 59.06 73.33 69.33 63.06 65.54 62.63 76.49 54.58 69.05 50.00 79.00 45.42 69.05 37.37 76.49 36.94 65.54 26.67 69.33 30.46 59.06 19.51 58.63 26.95 50.58 17.00 46.00 26.95 41.42 19.51 33.37 30.46 32.94 26.67 22.67 36.94 26.46 37.37 15.51 45.42 22.95Z" />
                    <path class="em-star" d="M50.00 13.00 54.58 22.95 62.63 15.51 63.06 26.46 73.33 22.67 69.54 32.94 80.49 33.37 73.05 41.42 83.00 46.00 73.05 50.58 80.49 58.63 69.54 59.06 73.33 69.33 63.06 65.54 62.63 76.49 54.58 69.05 50.00 79.00 45.42 69.05 37.37 76.49 36.94 65.54 26.67 69.33 30.46 59.06 19.51 58.63 26.95 50.58 17.00 46.00 26.95 41.42 19.51 33.37 30.46 32.94 26.67 22.67 36.94 26.46 37.37 15.51 45.42 22.95Z" />
                    <!-- Глобус. Экватор неподвижен, меридианы сжимаются по косинусу
                         долготы — так шар вращается, а не кувыркается рамка. -->
                    <circle class="em-globe" cx="50" cy="46" r="20" />
                    <path class="em-grid" d="M30 46H70" />
                    <g class="em-merid"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                    <g class="em-merid em-merid--c"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                    <g class="em-merid em-merid--b em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                    <g class="em-merid em-merid--d em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                    <circle class="em-globe-rim" cx="50" cy="46" r="20" />
                    <!-- Блик на стекле глобуса. Только на крупном: на 34 px он размером
                         в полпикселя и даёт грязь, а не стекло. -->
                    <ellipse class="em-gloss em-fine" cx="43" cy="37.5" rx="9" ry="5.2"
                             transform="rotate(-38 43 37.5)" />
                    <!-- Стрела связи с молниями и розой ветров в середине. -->
                    <path class="em-bolt em-fine" d="M33 31 45.5 41 40.5 44 63 60M33 61 45.5 51 40.5 48 63 32" />
                    <path class="em-arrow" d="M69 46 46 33.5 50.5 42 36 34.5 42 46 36 57.5 50.5 50 46 58.5Z" />
                    <path class="em-arrow-edge em-fine" d="M69 46 46 33.5 50.5 42 36 34.5 42 46 36 57.5 50.5 50 46 58.5Z" />
                    <path class="em-rose em-fine" d="M50 39 57 46 50 53 43 46Z" />
                    <path class="em-rose-star em-fine" d="M50 41.6 51.3 44.7 54.4 46 51.3 47.3 50 50.4 48.7 47.3 45.6 46 48.7 44.7Z" />
                    <path class="em-rose-edge em-fine" d="M50 39 57 46 50 53 43 46Z" />
                </svg>
            </span>
            <span>2 специальный отдел</span>
            <small>Подготовка, учёт и проверка технических отчётов</small>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="login-error" id="error" hidden></div>
            <label class="field">Логин
                <input type="text" id="login" name="login" autocomplete="username" autocapitalize="off"
                    spellcheck="false" required autofocus>
            </label>
            <label class="field">Пароль
                <div class="pw-field">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        required>
                    <button class="btn btn--ghost btn--sm pw-toggle" type="button" id="pw-toggle"
                        title="Показать пароль">Показать</button>
                </div>
            </label>
            <button class="btn btn--primary" type="submit" id="submit">Войти</button>
        </form>
    </div>
    </div>

    <script>
        'use strict';

        // Страница входа намеренно самостоятельна: она не зависит от app.js,
        // чтобы её можно было открыть даже при ошибке в основном приложении.
        (function () {
            const form = document.getElementById('login-form');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submit = document.getElementById('submit');
            const errorBox = document.getElementById('error');
            const toggle = document.getElementById('pw-toggle');

            // Пароль на изолированной машине набирают руками, без менеджера
            // паролей: вслепую длинный пароль вводят с опечаткой и получают
            // «неверный логин или пароль», не понимая, где ошиблись.
            toggle.addEventListener('click', function () {
                const shown = passwordInput.type === 'text';
                passwordInput.type = shown ? 'password' : 'text';
                toggle.textContent = shown ? 'Показать' : 'Скрыть';
                toggle.title = shown ? 'Показать пароль' : 'Скрыть пароль';
                passwordInput.focus();
            });

            function nextUrl() {
                const raw = new URLSearchParams(location.search).get('next') || '';
                // Пускаем только внутренние адреса: никаких переходов на чужие хосты.
                if (raw.startsWith('#/')) return '/' + raw;
                if (raw.startsWith('/') && !raw.startsWith('//')) return raw;
                return '/';
            }

            function showError(text) {
                errorBox.textContent = text;
                errorBox.hidden = false;
            }

            function hideError() {
                errorBox.hidden = true;
            }

            async function alreadyIn() {
                try {
                    const response = await fetch('/api/me', { credentials: 'same-origin' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && (data.user || data.auth_enabled === false)) {
                        location.replace(nextUrl());
                    }
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();
                const login = loginInput.value.trim();
                const password = passwordInput.value;
                if (!login || !password) {
                    showError('укажите логин и пароль');
                    return;
                }
                submit.disabled = true;
                submit.textContent = 'Проверка…';
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: login, password: password }),
                    });
                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = null;
                    }
                    if (!response.ok) {
                        showError((data && data.error) || ('не удалось войти (код ' + response.status + ')'));
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }
                    location.replace(nextUrl());
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Войти';
                }
            });

            alreadyIn();
        })();
    </script>
</body>
