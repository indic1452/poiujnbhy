<!doctype html>
<html lang="ru">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>Вход — 2 специальный отдел</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cpath%20d%3D%27M14%206H86V46C86%2070%2070%2087%2050%2096%2030%2087%2014%2070%2014%2046Z%27%20fill%3D%27%230a0d11%27%20stroke%3D%27%23d8b25a%27%20stroke-width%3D%278%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M50%2016%2055%2033%2068%2022%2065%2039%2082%2036%2071%2049%2082%2062%2065%2059%2068%2076%2055%2065%2050%2082%2045%2065%2032%2076%2035%2059%2018%2062%2029%2049%2018%2036%2035%2039%2032%2022%2045%2033Z%27%20fill%3D%27%239d151f%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2749%27%20r%3D%2719%27%20fill%3D%27%231663b4%27%2F%3E%3Cpath%20d%3D%27M31%2049H69%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%273%27%20fill%3D%27none%27%2F%3E%3Cellipse%20cx%3D%2750%27%20cy%3D%2749%27%20rx%3D%278%27%20ry%3D%2719%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%273%27%20fill%3D%27none%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2749%27%20r%3D%2719%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%273.5%27%20fill%3D%27none%27%2F%3E%3Cpath%20d%3D%27M34%2045H58V38L75%2049%2058%2060V53H34Z%27%20fill%3D%27%23c8202c%27%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="login-page">
    <!-- Фон: ночная Земля с орбиты. Кадр собран трассировкой по настоящим
         снимкам NASA — «Black Marble» (огни городов) и «Blue Marble»
         (рельеф), общественное достояние — сценарием tools/make_login_bg.py
         и лежит рядом файлом: изолированная машина ничего не скачивает.

         Своя фотография всегда важнее: положите файл login-bg.jpg рядом
         с settings.json, и окно входа возьмёт его. -->
    <img class="sky-photo" src="/brand/login-image" alt="">

    <div class="login-shell">
    <div class="login-card">
        <div class="brand">
            <!-- Эмблема отдела: та же, что в шапке приложения. Здесь она
                 крупнее — это единственное место, где у системы есть лицо.
                 Вращение делает один CSS, скрипт для него не нужен. -->
            <span class="emblem emblem--card" aria-label="Эмблема 2 специального отдела">
                <svg class="emblem-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                    <!-- Щит: золотая кайма по чёрному полю. -->
                    <path class="em-frame"
                          d="M16 5H84A4 4 0 0 1 88 9V46C88 71 72 88 50 97 28 88 12 71 12 46V9A4 4 0 0 1 16 5Z" />
                    <path class="em-frame-in em-fine"
                          d="M19 11H81V46C81 67 67 82 50 90 33 82 19 67 19 46Z" />
                    <!-- Звезда: шестнадцать лучей, длинные через один. -->
                    <path class="em-star" d="M50 14 54.19 24.91 62.25 16.44 61.94 28.12 72.63 23.37 67.88 34.06 79.56 33.75 71.09 41.81 82 46 71.09 50.19 79.56 58.25 67.88 57.94 72.63 68.63 61.94 63.88 62.25 75.56 54.19 67.09 50 78 45.81 67.09 37.75 75.56 38.06 63.88 27.37 68.63 32.12 57.94 20.44 58.25 28.91 50.19 18 46 28.91 41.81 20.44 33.75 32.12 34.06 27.37 23.37 38.06 28.12 37.75 16.44 45.81 24.91Z" />
                    <path class="em-star-edge em-fine" d="M50 14 54.19 24.91 62.25 16.44 61.94 28.12 72.63 23.37 67.88 34.06 79.56 33.75 71.09 41.81 82 46 71.09 50.19 79.56 58.25 67.88 57.94 72.63 68.63 61.94 63.88 62.25 75.56 54.19 67.09 50 78 45.81 67.09 37.75 75.56 38.06 63.88 27.37 68.63 32.12 57.94 20.44 58.25 28.91 50.19 18 46 28.91 41.81 20.44 33.75 32.12 34.06 27.37 23.37 38.06 28.12 37.75 16.44 45.81 24.91Z" />
                    <!-- Глобус. Экватор неподвижен, меридианы сжимаются по косинусу
                         долготы — так шар вращается, а не кувыркается рамка. -->
                    <circle class="em-globe" cx="50" cy="46" r="19" />
                    <path class="em-grid" d="M31 46H69" />
                    <g class="em-merid"><ellipse class="em-grid" cx="50" cy="46" rx="19" ry="19" /></g>
                    <g class="em-merid em-merid--c"><ellipse class="em-grid" cx="50" cy="46" rx="19" ry="19" /></g>
                    <g class="em-merid em-merid--b em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="19" ry="19" /></g>
                    <g class="em-merid em-merid--d em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="19" ry="19" /></g>
                    <circle class="em-globe-rim" cx="50" cy="46" r="19" />
                    <!-- Стрела связи поверх глобуса. -->
                    <path class="em-arrow-back em-fine" d="M26 32 49 46 26 60 33.5 46Z" />
                    <path class="em-arrow" d="M34 42H58V34.5L75 46 58 57.5V50H34Z" />
                    <path class="em-arrow-edge em-fine" d="M34 42H58V34.5L75 46 58 57.5V50H34Z" />
                </svg>
            </span>
            <span>2 специальный отдел</span>
            <small>Подготовка, учёт и проверка технических отчётов</small>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="login-error" id="error" hidden></div>
            <label class="field">Логин
                <input type="text" id="login" name="login" autocomplete="username" autocapitalize="off"
                    spellcheck="false" required autofocus>
            </label>
            <label class="field">Пароль
                <div class="pw-field">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        required>
                    <button class="btn btn--ghost btn--sm pw-toggle" type="button" id="pw-toggle"
                        title="Показать пароль">Показать</button>
                </div>
            </label>
            <button class="btn btn--primary" type="submit" id="submit">Войти</button>
        </form>
    </div>
    </div>

    <script>
        'use strict';

        // Страница входа намеренно самостоятельна: она не зависит от app.js,
        // чтобы её можно было открыть даже при ошибке в основном приложении.
        (function () {
            const form = document.getElementById('login-form');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submit = document.getElementById('submit');
            const errorBox = document.getElementById('error');
            const toggle = document.getElementById('pw-toggle');

            // Пароль на изолированной машине набирают руками, без менеджера
            // паролей: вслепую длинный пароль вводят с опечаткой и получают
            // «неверный логин или пароль», не понимая, где ошиблись.
            toggle.addEventListener('click', function () {
                const shown = passwordInput.type === 'text';
                passwordInput.type = shown ? 'password' : 'text';
                toggle.textContent = shown ? 'Показать' : 'Скрыть';
                toggle.title = shown ? 'Показать пароль' : 'Скрыть пароль';
                passwordInput.focus();
            });

            function nextUrl() {
                const raw = new URLSearchParams(location.search).get('next') || '';
                // Пускаем только внутренние адреса: никаких переходов на чужие хосты.
                if (raw.startsWith('#/')) return '/' + raw;
                if (raw.startsWith('/') && !raw.startsWith('//')) return raw;
                return '/';
            }

            function showError(text) {
                errorBox.textContent = text;
                errorBox.hidden = false;
            }

            function hideError() {
                errorBox.hidden = true;
            }

            async function alreadyIn() {
                try {
                    const response = await fetch('/api/me', { credentials: 'same-origin' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && (data.user || data.auth_enabled === false)) {
                        location.replace(nextUrl());
                    }
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();
                const login = loginInput.value.trim();
                const password = passwordInput.value;
                if (!login || !password) {
                    showError('укажите логин и пароль');
                    return;
                }
                submit.disabled = true;
                submit.textContent = 'Проверка…';
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: login, password: password }),
                    });
                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = null;
                    }
                    if (!response.ok) {
                        showError((data && data.error) || ('не удалось войти (код ' + response.status + ')'));
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }
                    location.replace(nextUrl());
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Войти';
                }
            });

            alreadyIn();
        })();
    </script>
</body>

</html>
