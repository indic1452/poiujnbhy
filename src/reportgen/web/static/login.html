<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>Вход — 2 специальный отдел</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2718%27%20fill%3D%27%2315507e%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-linecap%3D%27round%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2733%27%20stroke-width%3D%275%27%20opacity%3D%27.85%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2717%27%20stroke-width%3D%274%27%20opacity%3D%27.5%27%2F%3E%3Cpath%20d%3D%27M50%2012v11M50%2077v11M12%2050h11M77%2050h11%27%20stroke-width%3D%275%27%20opacity%3D%27.8%27%2F%3E%3Cpath%20d%3D%27M50%2050%2074%2030%27%20stroke-width%3D%276%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%274.5%27%20fill%3D%27%23ffffff%27%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="login-page">
    <!-- Фон: Земля с орбиты. Кадр собран трассировкой по настоящему снимку
         NASA Blue Marble (общественное достояние) сценарием
         tools/make_login_bg.py и лежит рядом файлом — изолированная машина
         ничего не скачивает.

         Своя фотография всегда важнее: положите файл login-bg.jpg рядом
         с settings.json, и окно входа возьмёт его. -->
    <img class="sky-photo" src="/brand/login-image" alt="">

    <div class="login-shell">
    <div class="login-card">
        <div class="brand">
            <!-- Эмблема отдела: та же, что в шапке приложения. Здесь она
                 крупнее — это единственное место, где у системы есть лицо.
                 Вращение делает один CSS, скрипт для него не нужен. -->
            <span class="emblem emblem--card" aria-label="Эмблема 2 специального отдела">
                <svg class="emblem-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                        <!-- неподвижное: дальномерные кольца и линии пеленга -->
                        <g class="emblem-grid" fill="none" stroke="currentColor">
                            <circle cx="50" cy="50" r="26"/>
                            <circle cx="50" cy="50" r="13.5"/>
                            <path d="M11.5 50H88.5M50 11.5V88.5"/>
                        </g>
                        <!-- неподвижное: кольцо со шкалой на 32 румба -->
                        <g class="emblem-scale" fill="none" stroke="currentColor">
                            <circle class="emblem-bezel" cx="50" cy="50" r="47"/>
                            <circle class="emblem-bezel emblem-bezel--in" cx="50" cy="50" r="38.5"/>
                            <path class="emblem-tick emblem-tick--minor" d="M59.17 3.9L58.68 6.36M67.99 6.58L67.03 8.89M76.11 10.92L74.72 13M89.08 23.89L87 25.28M93.42 32.01L91.11 32.97M96.1 40.83L93.64 41.32M96.1 59.17L93.64 58.68M93.42 67.99L91.11 67.03M89.08 76.11L87 74.72M76.11 89.08L74.72 87M67.99 93.42L67.03 91.11M59.17 96.1L58.68 93.64M40.83 96.1L41.32 93.64M32.01 93.42L32.97 91.11M23.89 89.08L25.28 87M10.92 76.11L13 74.72M6.58 67.99L8.89 67.03M3.9 59.17L6.36 58.68M3.9 40.83L6.36 41.32M6.58 32.01L8.89 32.97M10.92 23.89L13 25.28M23.89 10.92L25.28 13M32.01 6.58L32.97 8.89M40.83 3.9L41.32 6.36"/>
                            <path class="emblem-tick emblem-tick--inter" d="M83.23 16.77L80.05 19.95M83.23 83.23L80.05 80.05M16.77 83.23L19.95 80.05M16.77 16.77L19.95 19.95"/>
                            <path class="emblem-tick emblem-tick--card" d="M50 3L50 11.5M97 50L88.5 50M50 97L50 88.5M3 50L11.5 50"/>
                        </g>
                        <!-- подвижное: развёртка -->
                        <g class="emblem-sweep" fill="none">
                            <g class="emblem-trail" stroke="currentColor">
                                <path class="emblem-trail-seg" d="M49.24 21.01A29 29 0 0 0 45.46 21.36" opacity=".2"/>
                                <path class="emblem-trail-seg" d="M45.46 21.36A29 29 0 0 0 41.04 22.42" opacity=".13"/>
                                <path class="emblem-trail-seg" d="M41.04 22.42A29 29 0 0 0 36.39 24.39" opacity=".075"/>
                                <path class="emblem-trail-seg" d="M36.39 24.39A29 29 0 0 0 31.36 27.78" opacity=".035"/>
                            </g>
                            <path class="emblem-beam" d="M50 46L50 11.5"/>
                            <path class="emblem-cursor" d="M50 9.5L50 3"/>
                        </g>
                        <!-- неподвижное поверх развёртки: индекс нуля и ось станции -->
                        <path class="emblem-index" d="M50 11.5L46.8 18L53.2 18Z"/>
                        <circle class="emblem-hub" cx="50" cy="50" r="2.2"/>
                    </svg>
            </span>
            <span>2 специальный отдел</span>
            <small>Подготовка, учёт и проверка технических отчётов</small>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="login-error" id="error" hidden></div>
            <label class="field">Логин
                <input type="text" id="login" name="login" autocomplete="username" autocapitalize="off"
                    spellcheck="false" required autofocus>
            </label>
            <label class="field">Пароль
                <div class="pw-field">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        required>
                    <button class="btn btn--ghost btn--sm pw-toggle" type="button" id="pw-toggle"
                        title="Показать пароль">Показать</button>
                </div>
            </label>
            <button class="btn btn--primary" type="submit" id="submit">Войти</button>
        </form>
    </div>
    </div>

    <script>
        'use strict';

        // Страница входа намеренно самостоятельна: она не зависит от app.js,
        // чтобы её можно было открыть даже при ошибке в основном приложении.
        (function () {
            const form = document.getElementById('login-form');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submit = document.getElementById('submit');
            const errorBox = document.getElementById('error');
            const toggle = document.getElementById('pw-toggle');

            // Пароль на изолированной машине набирают руками, без менеджера
            // паролей: вслепую длинный пароль вводят с опечаткой и получают
            // «неверный логин или пароль», не понимая, где ошиблись.
            toggle.addEventListener('click', function () {
                const shown = passwordInput.type === 'text';
                passwordInput.type = shown ? 'password' : 'text';
                toggle.textContent = shown ? 'Показать' : 'Скрыть';
                toggle.title = shown ? 'Показать пароль' : 'Скрыть пароль';
                passwordInput.focus();
            });

            function nextUrl() {
                const raw = new URLSearchParams(location.search).get('next') || '';
                // Пускаем только внутренние адреса: никаких переходов на чужие хосты.
                if (raw.startsWith('#/')) return '/' + raw;
                if (raw.startsWith('/') && !raw.startsWith('//')) return raw;
                return '/';
            }

            function showError(text) {
                errorBox.textContent = text;
                errorBox.hidden = false;
            }

            function hideError() {
                errorBox.hidden = true;
            }

            async function alreadyIn() {
                try {
                    const response = await fetch('/api/me', { credentials: 'same-origin' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && (data.user || data.auth_enabled === false)) {
                        location.replace(nextUrl());
                    }
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();
                const login = loginInput.value.trim();
                const password = passwordInput.value;
                if (!login || !password) {
                    showError('укажите логин и пароль');
                    return;
                }
                submit.disabled = true;
                submit.textContent = 'Проверка…';
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: login, password: password }),
                    });
                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = null;
                    }
                    if (!response.ok) {
                        showError((data && data.error) || ('не удалось войти (код ' + response.status + ')'));
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }
                    location.replace(nextUrl());
                } catch (error) {
                    showError('сервер недоступен: проверьте, запущен ли reportgen');
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Войти';
                }
            });

            alreadyIn();
        })();
    </script>
</body>

</html>
