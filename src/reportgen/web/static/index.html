<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>2 специальный отдел</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cpath%20d%3D%27M17%208H83A3%203%200%200%201%2086%2011V45C86%2069%2070%2086%2050%2095%2030%2086%2014%2069%2014%2045V11A3%203%200%200%201%2017%208Z%27%20fill%3D%27%230d0f11%27%20stroke%3D%27%2307090b%27%20stroke-width%3D%278%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M17%208H83A3%203%200%200%201%2086%2011V45C86%2069%2070%2086%2050%2095%2030%2086%2014%2069%2014%2045V11A3%203%200%200%201%2017%208Z%27%20fill%3D%27none%27%20stroke%3D%27%23d2a63f%27%20stroke-width%3D%273.8%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M50.0%2013.0%2054.6%2023.0%2062.6%2015.5%2063.1%2026.5%2073.3%2022.7%2069.5%2032.9%2080.5%2033.4%2073.0%2041.4%2083.0%2046.0%2073.0%2050.6%2080.5%2058.6%2069.5%2059.1%2073.3%2069.3%2063.1%2065.5%2062.6%2076.5%2054.6%2069.0%2050.0%2079.0%2045.4%2069.0%2037.4%2076.5%2036.9%2065.5%2026.7%2069.3%2030.5%2059.1%2019.5%2058.6%2027.0%2050.6%2017.0%2046.0%2027.0%2041.4%2019.5%2033.4%2030.5%2032.9%2026.7%2022.7%2036.9%2026.5%2037.4%2015.5%2045.4%2023.0Z%27%20fill%3D%27%23eef3f8%27%2F%3E%3Cpath%20d%3D%27M50.0%2014.6%2054.3%2024.3%2062.0%2017.0%2062.3%2027.6%2072.2%2023.8%2068.4%2033.7%2079.0%2034.0%2071.7%2041.7%2081.4%2046.0%2071.7%2050.3%2079.0%2058.0%2068.4%2058.3%2072.2%2068.2%2062.3%2064.4%2062.0%2075.0%2054.3%2067.7%2050.0%2077.4%2045.7%2067.7%2038.0%2075.0%2037.7%2064.4%2027.8%2068.2%2031.6%2058.3%2021.0%2058.0%2028.3%2050.3%2018.6%2046.0%2028.3%2041.7%2021.0%2034.0%2031.6%2033.7%2027.8%2023.8%2037.7%2027.6%2038.0%2017.0%2045.7%2024.3Z%27%20fill%3D%27%237e0c14%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2746%27%20r%3D%2720%27%20fill%3D%27%23125fb6%27%2F%3E%3Cpath%20d%3D%27M30%2046H70%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%272.6%27%20fill%3D%27none%27%2F%3E%3Cellipse%20cx%3D%2750%27%20cy%3D%2746%27%20rx%3D%279%27%20ry%3D%2720%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%272.6%27%20fill%3D%27none%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2746%27%20r%3D%2720%27%20stroke%3D%27%23eef3f8%27%20stroke-width%3D%273%27%20fill%3D%27none%27%2F%3E%3Cpath%20d%3D%27M69%2046%2046%2033.5%2050.5%2042%2036%2034.5%2042%2046%2036%2057.5%2050.5%2050%2046%2058.5Z%27%20fill%3D%27%23c01019%27%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="app">
    <!-- Боковое меню. Разделов шесть, вертикальный список читается быстрее
         горизонтальной ленты и не отнимает высоту у таблиц. -->
    <aside class="side" id="side">
        <!-- Название отдела в 208 px одной строкой не помещается и наезжало
             на заголовок страницы. Ставим в две: сокращение, которое в отделе
             и так у всех на слуху, и под ним полное название. -->
        <a class="side-brand" href="#/board" data-route="board">
            <!-- Тот же щит, что и эмблема в углу шапки, но неподвижный и в один
                 цвет: в 22 px звезда и меридианы сливаются в кашу, а второе
                 вращение на экране только отвлекало бы от таблиц. -->
            <svg viewBox="0 0 100 100" aria-hidden="true" class="mark">
                <path d="M16 8H84V46C84 69 68 85 50 93 32 85 16 69 16 46Z" fill="none"
                      stroke="currentColor" stroke-width="8" stroke-linejoin="round" />
                <circle cx="50" cy="46" r="16" fill="none" stroke="currentColor" stroke-width="5.5" />
                <path d="M38 42H56V36L70 46 56 56V50H38Z" fill="currentColor" />
            </svg>
            <span class="side-brand-text">
                <b id="brand-short">2СО</b>
                <span id="brand-name">2 специальный отдел</span>
            </span>
        </a>

        <nav class="side-nav" id="nav" aria-label="Разделы"></nav>

        <div class="side-foot">
            <button class="side-collapse" id="side-btn" type="button" title="Свернуть меню">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Свернуть</span>
            </button>
        </div>
    </aside>

    <div class="shell">
        <header class="topbar">
            <button class="btn btn--icon side-open" id="side-open" type="button" title="Меню" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="topbar-title" id="topbar-title"></h1>
            <div class="topbar-right">
                <span id="llm-info" class="llm-dot" title=""></span>
                <button class="btn btn--ghost btn--sm" id="theme-btn" title="Тема оформления">Авто</button>
                <a class="user-chip" id="user-chip" href="#/me" data-route="me" title="Личный кабинет" hidden>
                    <span class="avatar" id="user-initials"></span>
                    <span class="user-chip-text">
                        <b id="user-name"></b>
                        <span id="user-role"></span>
                    </span>
                </a>
                <button class="btn btn--sm" id="logout-btn" hidden>Выйти</button>
                <!-- Эмблема отдела: щит со звездой, глобусом и стрелой связи.
                     Глобус вращается. Стоит в самом углу и ведёт на дашборд —
                     знак организации всегда ведёт домой. -->
                <span class="topbar-sep" aria-hidden="true"></span>
                <a class="emblem" id="emblem" href="#/board" data-route="board"
                       title="2 специальный отдел — на дашборд"
                       aria-label="Эмблема 2 специального отдела, переход на дашборд">
                    <svg class="emblem-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                        <!-- Щит: золотая полоса между чёрной кромкой снаружи и чёрным полем
                             внутри — как на образце. Обе линии рисует один и тот же контур
                             разной толщины, второго пути под кайму не нужно. -->
                        <path class="em-frame-out" d="M17 8H83A3 3 0 0 1 86 11V45C86 69 70 86 50 95 30 86 14 69 14 45V11A3 3 0 0 1 17 8Z" />
                        <path class="em-frame" d="M17 8H83A3 3 0 0 1 86 11V45C86 69 70 86 50 95 30 86 14 69 14 45V11A3 3 0 0 1 17 8Z" />
                        <path class="em-frame-in em-fine" d="M20 13H80V45C80 66 66 80 50 88 34 80 20 66 20 45Z" />
                        <!-- Звезда: шестнадцать зубцов, длинные через один. Серебряная кайма
                             лежит ПОД красным и выходит наружу — так зубцы читаются красными,
                             а не белыми, как вышло бы при обводке поверх заливки. -->
                        <path class="em-star-halo em-fine" d="M50.00 13.00 54.58 22.95 62.63 15.51 63.06 26.46 73.33 22.67 69.54 32.94 80.49 33.37 73.05 41.42 83.00 46.00 73.05 50.58 80.49 58.63 69.54 59.06 73.33 69.33 63.06 65.54 62.63 76.49 54.58 69.05 50.00 79.00 45.42 69.05 37.37 76.49 36.94 65.54 26.67 69.33 30.46 59.06 19.51 58.63 26.95 50.58 17.00 46.00 26.95 41.42 19.51 33.37 30.46 32.94 26.67 22.67 36.94 26.46 37.37 15.51 45.42 22.95Z" />
                        <path class="em-star" d="M50.00 13.00 54.58 22.95 62.63 15.51 63.06 26.46 73.33 22.67 69.54 32.94 80.49 33.37 73.05 41.42 83.00 46.00 73.05 50.58 80.49 58.63 69.54 59.06 73.33 69.33 63.06 65.54 62.63 76.49 54.58 69.05 50.00 79.00 45.42 69.05 37.37 76.49 36.94 65.54 26.67 69.33 30.46 59.06 19.51 58.63 26.95 50.58 17.00 46.00 26.95 41.42 19.51 33.37 30.46 32.94 26.67 22.67 36.94 26.46 37.37 15.51 45.42 22.95Z" />
                        <!-- Глобус. Экватор неподвижен, меридианы сжимаются по косинусу
                             долготы — так шар вращается, а не кувыркается рамка. -->
                        <circle class="em-globe" cx="50" cy="46" r="20" />
                        <path class="em-grid" d="M30 46H70" />
                        <g class="em-merid"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                        <g class="em-merid em-merid--c"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                        <g class="em-merid em-merid--b em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                        <g class="em-merid em-merid--d em-fine"><ellipse class="em-grid" cx="50" cy="46" rx="20" ry="20" /></g>
                        <circle class="em-globe-rim" cx="50" cy="46" r="20" />
                        <!-- Блик на стекле глобуса. Только на крупном: на 34 px он размером
                             в полпикселя и даёт грязь, а не стекло. -->
                        <ellipse class="em-gloss em-fine" cx="43" cy="37.5" rx="9" ry="5.2"
                                 transform="rotate(-38 43 37.5)" />
                        <!-- Стрела связи с молниями и розой ветров в середине. -->
                        <path class="em-bolt em-fine" d="M33 31 45.5 41 40.5 44 63 60M33 61 45.5 51 40.5 48 63 32" />
                        <path class="em-arrow" d="M69 46 46 33.5 50.5 42 36 34.5 42 46 36 57.5 50.5 50 46 58.5Z" />
                        <path class="em-arrow-edge em-fine" d="M69 46 46 33.5 50.5 42 36 34.5 42 46 36 57.5 50.5 50 46 58.5Z" />
                        <path class="em-rose em-fine" d="M50 39 57 46 50 53 43 46Z" />
                        <path class="em-rose-star em-fine" d="M50 41.6 51.3 44.7 54.4 46 51.3 47.3 50 50.4 48.7 47.3 45.6 46 48.7 44.7Z" />
                        <path class="em-rose-edge em-fine" d="M50 39 57 46 50 53 43 46Z" />
                    </svg>
                </a>
            </div>
        </header>

        <main id="view" aria-live="polite">
            <div class="empty">
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <div class="side-scrim" id="side-scrim" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="assertive"></div>

    <div id="overlay" hidden>
        <div class="overlay-box">
            <div class="spinner"></div>
            <div class="what" id="overlay-what">Выполняется операция</div>
            <div class="note" id="overlay-note"></div>
            <div class="elapsed" id="overlay-elapsed"></div>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>

</html>
