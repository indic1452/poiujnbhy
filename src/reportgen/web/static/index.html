<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>Генератор технических отчётов</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5fd0'/%3E%3Cpath d='M3 11.5 5.5 7l2 2.6L10 4.5l3 7' fill='none' stroke='white' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="app">
    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 12.5 5.2 6.5l2.6 3.4L10.6 3l3.4 9.5" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Отчёты</span>
        </div>
        <nav class="nav" id="nav" aria-label="Разделы">
            <a href="#/cases" data-route="cases">Кейсы</a>
            <a href="#/chat" data-route="chat">Помощник</a>
            <a href="#/library" data-route="library">Библиотека</a>
            <a href="#/stats" data-route="stats">Метрики</a>
        </nav>
        <div class="topbar-right">
            <span id="llm-info" class="small faint"></span>
            <button class="btn btn--ghost btn--sm" id="theme-btn" title="Тема оформления">Тема: авто</button>
            <a class="user-chip" id="user-chip" href="#/me" data-route="me" title="Личный кабинет" hidden>
                <b id="user-name"></b>
                <span id="user-role"></span>
            </a>
            <button class="btn btn--sm" id="logout-btn" hidden>Выйти</button>
        </div>
    </header>

    <main id="view" aria-live="polite">
        <div class="empty">
            <div class="spinner"></div>
            Загрузка интерфейса…
        </div>
    </main>

    <div id="modal-root"></div>
    <div id="toasts" aria-live="assertive"></div>

    <div id="overlay" hidden>
        <div class="overlay-box">
            <div class="spinner"></div>
            <div class="what" id="overlay-what">Выполняется операция</div>
            <div class="note" id="overlay-note"></div>
            <div class="elapsed" id="overlay-elapsed"></div>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>

</html>
