<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="same-origin">
    <title>2 специальный отдел</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2718%27%20fill%3D%27%2315507e%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-linecap%3D%27round%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2733%27%20stroke-width%3D%275%27%20opacity%3D%27.85%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2717%27%20stroke-width%3D%274%27%20opacity%3D%27.5%27%2F%3E%3Cpath%20d%3D%27M50%2012v11M50%2077v11M12%2050h11M77%2050h11%27%20stroke-width%3D%275%27%20opacity%3D%27.8%27%2F%3E%3Cpath%20d%3D%27M50%2050%2074%2030%27%20stroke-width%3D%276%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%274.5%27%20fill%3D%27%23ffffff%27%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="app">
    <!-- Боковое меню. Разделов шесть, вертикальный список читается быстрее
         горизонтальной ленты и не отнимает высоту у таблиц. -->
    <aside class="side" id="side">
        <!-- Название отдела в 208 px одной строкой не помещается и наезжало
             на заголовок страницы. Ставим в две: сокращение, которое в отделе
             и так у всех на слуху, и под ним полное название. -->
        <a class="side-brand" href="#/board" data-route="board">
            <!-- Тот же знак, что и эмблема в углу шапки, но неподвижный и
                 упрощённый: в 22 px шкала в 32 румба сливается в кашу, а
                 второе вращение на экране только отвлекало бы от таблиц. -->
            <svg viewBox="0 0 100 100" aria-hidden="true" class="mark">
                <g fill="none" stroke="currentColor" stroke-linecap="round">
                    <circle cx="50" cy="50" r="40" stroke-width="6" opacity=".9" />
                    <circle cx="50" cy="50" r="20" stroke-width="5" opacity=".45" />
                    <path d="M50 4v14M50 82v14M4 50h14M82 50h14" stroke-width="6" opacity=".75" />
                    <path d="M50 50 76 27" stroke-width="7" />
                </g>
                <circle cx="50" cy="50" r="5" fill="currentColor" />
            </svg>
            <span class="side-brand-text">
                <b id="brand-short">2СО</b>
                <span id="brand-name">2 специальный отдел</span>
            </span>
        </a>

        <nav class="side-nav" id="nav" aria-label="Разделы"></nav>

        <div class="side-foot">
            <button class="side-collapse" id="side-btn" type="button" title="Свернуть меню">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Свернуть</span>
            </button>
        </div>
    </aside>

    <div class="shell">
        <header class="topbar">
            <button class="btn btn--icon side-open" id="side-open" type="button" title="Меню" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="topbar-title" id="topbar-title"></h1>
            <div class="topbar-right">
                <span id="llm-info" class="llm-dot" title=""></span>
                <button class="btn btn--ghost btn--sm" id="theme-btn" title="Тема оформления">Авто</button>
                <a class="user-chip" id="user-chip" href="#/me" data-route="me" title="Личный кабинет" hidden>
                    <span class="avatar" id="user-initials"></span>
                    <span class="user-chip-text">
                        <b id="user-name"></b>
                        <span id="user-role"></span>
                    </span>
                </a>
                <button class="btn btn--sm" id="logout-btn" hidden>Выйти</button>
                <!-- Эмблема отдела: круговая шкала пеленга с идущей по ней
                     развёрткой. Стоит в самом углу и ведёт на дашборд —
                     знак организации всегда ведёт домой. -->
                <span class="topbar-sep" aria-hidden="true"></span>
                <a class="emblem" id="emblem" href="#/board" data-route="board"
                       title="2 специальный отдел — на дашборд"
                       aria-label="Эмблема 2 специального отдела, переход на дашборд">
                    <svg class="emblem-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                        <!-- Неподвижное: обойма, дальномерное кольцо и шкала.
                             Делений восемь, а не тридцать два: на 34 px деление в треть
                             пикселя — не шкала, а накатка. Рисунок перечерчен под рабочий
                             размер, а не уменьшен с крупного. -->
                        <g class="emblem-still" fill="none" stroke="currentColor" stroke-linecap="butt">
                            <circle class="emblem-bezel" cx="50" cy="50" r="43" />
                            <circle class="emblem-ring" cx="50" cy="50" r="23" />
                            <path class="emblem-tick" d="M93 50L85 50M50 93L50 85M7 50L15 50" />
                            <path class="emblem-tick emblem-tick--half"
                                  d="M80.41 19.59L76.52 23.48M80.41 80.41L76.52 76.52M19.59 80.41L23.48 76.52M19.59 19.59L23.48 23.48" />
                        </g>
                        <!-- Подвижное: развёртка. Вращается только она. -->
                        <g class="emblem-sweep" fill="none">
                            <path class="emblem-beam" d="M50 50L50 11" />
                        </g>
                        <!-- Поверх развёртки: нуль шкалы и ось станции. Нуль неподвижен —
                             отсчёт читается по нему, а не по бегущему лучу. -->
                        <path class="emblem-index" d="M50 7L50 16" fill="none" stroke-linecap="butt" />
                        <circle class="emblem-hub" cx="50" cy="50" r="3.4" />
                    </svg>
                </a>
            </div>
        </header>

        <main id="view" aria-live="polite">
            <div class="empty">
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <div class="side-scrim" id="side-scrim" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="assertive"></div>

    <div id="overlay" hidden>
        <div class="overlay-box">
            <div class="spinner"></div>
            <div class="what" id="overlay-what">Выполняется операция</div>
            <div class="note" id="overlay-note"></div>
            <div class="elapsed" id="overlay-elapsed"></div>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>

</html>
