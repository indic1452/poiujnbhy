# Обратный прокси перед reportgen. Наружу торчит только он: приложение слушает
# 127.0.0.1:8080 и TLS не умеет.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/reportgen   # Debian/Ubuntu
#   sudo ln -s /etc/nginx/sites-available/reportgen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (в RHEL-семействе — /etc/nginx/conf.d/reportgen.conf, без sites-enabled)
#
# Что здесь важно и почему:
#   * client_max_body_size 200m — совпадает с REPORTGEN_MAX_UPLOAD_MB=200;
#     если развести эти числа, nginx оборвёт загрузку раньше приложения и
#     инженер получит немую 413 вместо понятного сообщения;
#   * proxy_read_timeout 600s — отчёт генерируется прямо в HTTP-запросе
#     (docs/09 р. 9.8), на MoE-модели с выгрузкой в ОЗУ это минуты;
#   * буферизация ответа выключена — индикатор в интерфейсе должен шевелиться.

# Ограничение частоты попыток входа: 10 запросов в минуту с адреса.
limit_req_zone $binary_remote_addr zone=reportgen_login:10m rate=10r/m;

upstream reportgen_app {
    server 127.0.0.1:8080 fail_timeout=0;   # fail_timeout=0: долгая генерация — не сбой
    keepalive 8;
}

# --- HTTP: только редирект на HTTPS ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name reportgen.example.local;    # ЗАМЕНИТЕ на имя сервера в вашей сети

    # Внутри изолированного контура ACME не нужен, но если сертификаты выдаёт
    # внутренний УЦ по HTTP-01, оставьте этот location.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reportgen.example.local;    # ЗАМЕНИТЕ

    # Сертификат внутреннего УЦ либо самоподписанный (docs/10, раздел «nginx и TLS»).
    ssl_certificate     /etc/nginx/ssl/reportgen.crt;
    ssl_certificate_key /etc/nginx/ssl/reportgen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Доступ только из офисной сети/VPN (docs/07 р. 7.1). Раскомментируйте и
    # укажите свои подсети — это дешевле и надёжнее любой аутентификации.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # --- заголовки безопасности --------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;
    # HSTS включайте, только когда весь этот хост навсегда на HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Интерфейс не тянет ничего извне — в изолированном контуре и не смог бы.
    # 'unsafe-inline' для стилей и скриптов оставлен под встроенную вёрстку
    # страниц; если интерфейс соберут с внешними файлами, ужесточите.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # --- размеры и таймауты -------------------------------------------------
    # Загрузка документов библиотеки: PDF на сотни мегабайт — норма.
    client_max_body_size 200m;
    client_body_timeout  300s;
    client_body_buffer_size 1m;
    send_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown;
    gzip_min_length 1024;

    access_log /var/log/nginx/reportgen.access.log;
    error_log  /var/log/nginx/reportgen.error.log warn;

    # --- приложение ---------------------------------------------------------
    location / {
        proxy_pass http://reportgen_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    600s;
        # Генерация отчёта на 30 страниц занимает минуты — это не зависание.
        proxy_read_timeout    600s;

        # Ответ отдаётся клиенту по мере готовности, а не целиком в конце.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Вход: тот же прокси, но с ограничением частоты (burst 5 — чтобы не
    # ломать нормальную работу отдела, nodelay — чтобы не копить очередь).
    location = /api/auth/login {
        limit_req zone=reportgen_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://reportgen_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка живости для мониторинга: доступна только с самого сервера.
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass http://reportgen_app;
        proxy_set_header Host $host;
    }

    # Интерактивная документация API. В продуктиве обычно лишняя — закройте,
    # если по регламенту наружу отдаётся только интерфейс.
    # location /api/docs { deny all; }
}
