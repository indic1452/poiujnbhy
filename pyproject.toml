# Пакет reportgen: src-layout, установка через pip, две точки входа.
#
#   pip install -e .            # разработка (правки в src/ видны сразу)
#   pip install .               # установка на сервер
#
# Зависимости приложения перечислены в requirements.txt и продублированы ниже
# в [project.dependencies]: pip ставит их сам, requirements.txt остаётся для
# офлайн-переноса (make wheels) и для фиксации точных версий.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportgen"
description = "Локальная система генерации технических отчётов по обращениям заказчиков"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dynamic = ["version"]
keywords = ["reports", "rag", "llm", "telecom", "offline"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
reportgen = "reportgen.cli:main"          # CLI: index, ingest, generate, verify, useradd, serve…
reportgen-web = "reportgen.web.__main__:main"  # веб-сервер (uvicorn), настройки из REPORTGEN_*

[tool.setuptools]
# Ничего, кроме пакета, в дистрибутив не тянем: шаблоны и примеры живут рядом с
# установкой и правятся инженерами, поэтому их место — в /opt и /var, не в site-packages.
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "reportgen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["reportgen*"]

[tool.setuptools.package-data]
# Файлы, без которых пакет неработоспособен после установки.
"reportgen.store" = ["schema.sql"]
"reportgen.web" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PLC0415"]
ignore = [
    "E501",    # длину строк ловит форматтер, а в русских комментариях она плавает
    "B008",    # Depends()/File() в аргументах — идиома FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # import _bootstrap обязан идти до импортов reportgen

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
